name: Windows desktop visual QA build

on:
  push:
    branches: [qa/window-shadow]
    paths: [.github/workflows/windows-shadow-build.yml]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: npm ci
      - name: Build the isolated Windows test executable
        shell: pwsh
        run: |
          $qaConfig = Join-Path $env:RUNNER_TEMP "paydance-qa.json"
          '{"identifier":"com.cheney.paydance-shadow-qa","bundle":{"createUpdaterArtifacts":false}}' |
            Set-Content -LiteralPath $qaConfig -Encoding utf8NoBOM
          npm run tauri -- build --no-bundle --config $qaConfig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paydance-windows-qa
          path: src-tauri/target/release/pay-dance.exe
          if-no-files-found: error
          retention-days: 7
